# Sai game show — self-hosted.
#   cp .env.example .env     (edit it)
#   docker compose up -d --build
#
# The app listens on port 8080 INSIDE the container and serves everything (pages, API and the /ws WebSocket).
# Expose it with your own Caddy setup: add your labels / network / ports below (examples at the bottom).
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: sai-gameshow:latest
    container_name: sai-gameshow
    restart: unless-stopped
    env_file: .env
    volumes:
      - gameshow-data:/data          # the database, backups and the session secret
    # --- keep it small and contained on a shared server ---
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    ulimits:
      nofile: { soft: 65535, hard: 65535 }   # one descriptor per phone: plenty of headroom
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # ---- add your own exposure here, e.g. for caddy-docker-proxy: ----
    # networks: [caddy]
    # labels:
    #   caddy: game.example.org
    #   caddy.reverse_proxy: "{{upstreams 8080}}"
    # ---- or, for a Caddy on the host: ----
    # ports: ["127.0.0.1:8080:8080"]

volumes:
  gameshow-data:

