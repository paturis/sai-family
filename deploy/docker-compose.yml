# Sai game show — self-hosted.
#   cp .env.example .env     (edit it)
#   docker compose up -d --build
#
# The app listens on port 8080 INSIDE the container and serves everything (pages, API and the /ws WebSocket).
# It is exposed at https://gameshow.sathyasai.org by the caddy-docker-proxy labels and the shared "caddy" network below.
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: sai-gameshow:latest
    container_name: sai-gameshow
    restart: unless-stopped
    env_file: .env
    volumes:
      - gameshow-data:/data          # the database, backups and the session secret
      # - ../sounds:/app/web/sounds:ro   # optional: use your own sound files without rebuilding (see sounds/README.txt)
    # --- keep it small and contained on a shared server ---
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    ulimits:
      nofile: { soft: 65535, hard: 65535 }   # one descriptor per phone: plenty of headroom
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # ---- exposed through the existing caddy-docker-proxy ----
    networks: [caddy]
    labels:
      caddy: gameshow.sathyasai.org
      caddy.reverse_proxy: "{{upstreams 8080}}"
    # (Caddy on the host instead? Remove the networks and labels above and publish a port: ports: ["127.0.0.1:8080:8080"])

volumes:
  gameshow-data:

networks:
  caddy:
    external: true       # the network your caddy-docker-proxy is on (check with: docker network ls)
