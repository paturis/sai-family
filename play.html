<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>One Sai Family — Survey</title>
<style>
:root{--navy:#1B3B6F;--orange:#F47920;--cream:#F6F4EE;--ink:#14284d;--muted:#5a6b8a;--ok:#1f8a5b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink);font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:18px 18px 40px;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.dot{width:38px;height:38px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:20px}
header b{display:block;font-size:15px;letter-spacing:-.01em;color:var(--navy)}
header span{font-size:11px;color:var(--orange);font-weight:700;letter-spacing:.12em}
.card{background:#fff;border-radius:18px;padding:22px 20px;box-shadow:0 8px 28px rgba(27,59,111,.12);border-top:5px solid var(--orange)}
.pill{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--orange);margin-bottom:10px}
.q{font-size:22px;font-weight:800;line-height:1.25;color:var(--navy);margin:0 0 14px}
input[type=text]{width:100%;font:inherit;font-size:18px;padding:14px;border:2px solid #cfd8e8;border-radius:12px;background:#fff;color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--orange)}
button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:15px;font-size:17px;width:100%;margin-top:12px;cursor:pointer}
.go{background:var(--navy);color:#fff}.go:disabled{opacity:.5}
.skip{background:transparent;color:var(--muted);font-size:14px;font-weight:700;padding:8px;margin-top:4px}
.timer{height:7px;background:#e6ebf5;border-radius:6px;overflow:hidden;margin:0 0 16px}
.timer i{display:block;height:100%;background:var(--orange);width:100%;transition:width 1s linear}
.big{font-size:44px;text-align:center;margin:6px 0}
.msg{text-align:center}.msg h2{margin:6px 0;color:var(--navy);font-size:22px}.msg p{margin:6px 0;color:var(--muted);font-size:15px;line-height:1.4}
.ok{color:var(--ok);font-weight:800;margin-top:12px;text-align:center}
.tiny{font-size:12px;color:var(--muted);text-align:center;margin-top:auto;padding-top:24px}
.hidden{display:none}
</style>
<script src="firebase-config.js"></script>
</head>
<body>
<div class="wrap">
  <header><div class="dot">✦</div><div><span>SAI RETREAT</span><b>One Sai Family — Survey Says!</b></div></header>
  <div id="view"></div>
  <div class="tiny">Anonymous · No name or email needed · Sai Ram 🙏</div>
</div>
<script>
'use strict';
var FB_BASE='https://www.gstatic.com/firebasejs/10.12.2/';
var view=document.getElementById('view');
var code=(new URLSearchParams(location.search).get('code')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
var disp=null,dispSub=false,st=null,offset=0,shownKey='',answered={},skipped={},last={},tick=null,backend=null;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function card(icon,h,sub){return '<div class="card msg"><div class="big">'+icon+'</div><h2>'+h+'</h2>'+(sub?'<p>'+sub+'</p>':'')+'</div>'}

function scoreCard(){if(!disp)return '';var t=disp.teams,r=disp.round;
  return '<div class="card" style="margin-top:12px"><div class="pill">LIVE SCORES</div><div style="display:flex;justify-content:space-between;gap:10px;text-align:center">'+
   '<div style="flex:1"><div style="font-size:13px;color:#5a6b8a;font-weight:700">'+esc(t.A.name)+'</div><div style="font-size:40px;font-weight:900;color:#F47920">'+t.A.score+'</div></div>'+
   '<div style="flex:1"><div style="font-size:13px;color:#5a6b8a;font-weight:700">'+esc(t.B.name)+'</div><div style="font-size:40px;font-weight:900;color:#F47920">'+t.B.score+'</div></div></div>'+
   (r?'<div style="margin-top:8px;font-size:14px;color:#14284d"><b>Round '+r.n+':</b> '+esc(r.question)+'</div>':(disp.view==='fast'?'<div style="margin-top:8px;font-size:14px"><b>Fast Money</b></div>':''))+'</div>'}
function askCode(msg){
  view.innerHTML='<div class="card"><div class="pill">JOIN THE SURVEY</div><p class="q">Enter the code shown on the screen</p>'+
   '<input type="text" id="codeIn" maxlength="5" autocapitalize="characters" autocomplete="off" placeholder="e.g. K7PQ2">'+
   '<button class="go" id="codeGo">Join</button>'+(msg?'<div class="ok" style="color:#b3261e">'+esc(msg)+'</div>':'')+'</div>';
  document.getElementById('codeGo').onclick=function(){var c=document.getElementById('codeIn').value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(c)location.search='?code='+c};
  document.getElementById('codeIn').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('codeGo').click()});
}

/* ---------- buzzer mode (Jeopardy): pick your team, then hit BUZZ when the host opens the buzzers ---------- */
var bz={team:null,pressed:{}};try{bz.team=localStorage.getItem('buzzTeam_'+code)}catch(e){}
function renderBuzzer(){
  var teams=st.teams||[];
  if(bz.team===null||bz.team===''||isNaN(+bz.team)||+bz.team>=teams.length){
    view.innerHTML='<div class="card"><div class="pill">BUZZER</div><p class="q">Which team are you on?</p>'+teams.map(function(n,i){return '<button class="go" data-t="'+i+'">'+esc(n)+'</button>'}).join('')+'</div>';
    [].forEach.call(view.querySelectorAll('[data-t]'),function(b){b.onclick=function(){bz.team=b.getAttribute('data-t');try{localStorage.setItem('buzzTeam_'+code,bz.team)}catch(e){}render()}});return}
  var me=+bz.team,locked=(st.locked||[]).indexOf(me)>=0,open=st.phase==='open'&&!locked&&!bz.pressed[st.q];
  var head='<div class="pill">TEAM · '+esc(teams[me])+'</div>';
  if(st.phase==='open'&&bz.pressed[st.q])view.innerHTML='<div class="card msg">'+head+'<div class="big">🔔</div><h2>Buzzed!</h2><p>Waiting to see who was first…</p></div>';
  else if(open)view.innerHTML='<div class="card msg">'+head+'<button id="buzz" style="font-size:44px;padding:60px 10px;background:#c0392b;color:#fff;border-radius:24px;margin-top:10px">BUZZ!</button><div class="timer" style="margin-top:14px"><i id="tbar"></i></div></div>';
  else if(st.phase==='locked'){var w=st.winner;view.innerHTML='<div class="card msg">'+head+'<div class="big">'+(w===me?'🏆':'⏳')+'</div><h2>'+(w==null||w<0?'No one buzzed':(w===me?'You buzzed first!':esc(teams[w])+' buzzed first'))+'</h2></div>'}
  else if(locked)view.innerHTML='<div class="card msg">'+head+'<div class="big">🔒</div><h2>Your team is locked out</h2><p>Another team may answer.</p></div>';
  else view.innerHTML='<div class="card msg">'+head+'<div class="big">🎯</div><h2>Get ready</h2><p>The buzzers open after the host reads the clue.</p></div>';
  var bb=document.getElementById('buzz');if(bb){var fire=function(e){e.preventDefault();var q=st.q;if(bz.pressed[q])return;bz.pressed[q]=true;
      (backend.buzz||backend.submit)(code,q,me+'|'+(teams[me]||'')).then(function(){render()},function(){bz.pressed[q]=false;alert('Could not buzz — try again.')});render()};
    bb.addEventListener('pointerdown',fire);bb.addEventListener('click',fire)}}
function render(){
  if(!st){view.innerHTML=card('🕉️','Connecting…');return}
  if(st.missing){askCode('That code was not found. Please check the screen and try again.');return}
  if(st.mode==='buzzer'){renderBuzzer();return}
  var key=st.phase+'|'+st.q;
  if(st.phase==='open'&&st.question){
    var q=st.q;
    if(skipped[q]){if(shownKey!==key+'s'){shownKey=key+'s';view.innerHTML=card('⏭️','Skipped','The next question is coming up.')}return}
    if(shownKey===key)return;           // keep typing intact when the doc updates
    shownKey=key;
    view.innerHTML='<div class="card"><div class="pill">QUESTION '+(q+1)+' OF '+st.total+'</div><div class="timer"><i id="tbar"></i></div>'+
      '<p class="q">'+esc(st.question.en)+'</p>'+
      '<input type="text" id="ans" maxlength="80" autocomplete="off" autocapitalize="sentences" placeholder="Your short answer" value="'+esc(last[q]||'')+'">'+
      '<button class="go" id="send">Send</button>'+
      (st.optional?'<button class="skip" id="skip">I don\'t know — skip</button>':'')+
      '<div class="ok hidden" id="okmsg">✓ Received — you can change it until time is up</div></div>';
    document.getElementById('send').onclick=send;
    var sk=document.getElementById('skip');if(sk)sk.onclick=function(){skipped[q]=true;render()};
    document.getElementById('ans').addEventListener('keydown',function(e){if(e.key==='Enter')send()});
    if(answered[q])document.getElementById('okmsg').classList.remove('hidden');
  }else if(st.phase==='closed'){
    if(shownKey===key)return;shownKey=key;view.innerHTML=card('✅','Time is up — thank you!','The next question is coming up.');
  }else if(st.phase==='done'||st.phase==='ended'){
    shownKey=key;view.innerHTML=card('🙏','Thank you! Sai Ram','The survey is complete. Watch the screen for the game!')+scoreCard();
    if(backend.subscribeDisplay&&!dispSub){dispSub=true;backend.subscribeDisplay(code,function(d){disp=d;if(st&&(st.phase==='done'||st.phase==='ended'))view.innerHTML=card('🙏','Thank you! Sai Ram','The survey is complete. Watch the screen for the game!')+scoreCard()})}
  }else{
    if(shownKey===key)return;shownKey=key;view.innerHTML=card('🕉️','Sai Ram! You\'re in.','Keep this page open. The first question will appear here.');
  }
}

function send(){
  var inp=document.getElementById('ans'),a=(inp.value||'').trim(),q=st.q;
  if(!a){inp.focus();return}
  var btn=document.getElementById('send');btn.disabled=true;last[q]=a;
  backend.submit(code,q,a.slice(0,80)).then(function(){
    btn.disabled=false;answered[q]=true;var ok=document.getElementById('okmsg');if(ok)ok.classList.remove('hidden');
  },function(e){btn.disabled=false;
    alert(String(e&&e.code||e).indexOf('permission')>=0?'Sorry — this question just closed.':'Network problem — please try again.')});
}

setInterval(function(){
  var bar=document.getElementById('tbar');if(!bar||!st||st.phase!=='open'||!st.closesAt)return;
  var tot=Math.max(1,st.seconds||45),left=Math.max(0,(st.closesAt-(Date.now()+offset))/1000);
  bar.style.width=Math.min(100,left/tot*100)+'%';
},500);

function onState(s){
  if(!s){st={missing:true};render();return}
  if(s.hostNow)offset=s.hostNow-Date.now();   // align our clock with the host's for the countdown
  st=s;render();
}

/* ---------- Firebase back end (anonymous sign-in, one live doc, one answer doc per question) ---------- */
async function firebaseBackend(){
  var cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.apiKey||/PASTE|YOUR/i.test(cfg.apiKey))throw new Error('This site is not configured yet (firebase-config.js).');
  var A=await import(FB_BASE+'firebase-app.js'),F=await import(FB_BASE+'firebase-firestore.js'),Au=await import(FB_BASE+'firebase-auth.js');
  var app=A.initializeApp(cfg),db=F.getFirestore(app),auth=Au.getAuth(app);
  var cred=await Au.signInAnonymously(auth),uid=cred.user.uid;
  return{
    subscribe:function(c,cb){return F.onSnapshot(F.doc(db,'live',c),function(s){cb(s.exists()?s.data():null)},function(){cb(null)})},
    subscribeDisplay:function(c,cb){return F.onSnapshot(F.doc(db,'display',c),function(s){cb(s.exists()?s.data():null)},function(){})},
    submit:function(c,q,a){return F.setDoc(F.doc(db,'live',c,'answers',uid+'_'+q),{uid:uid,q:q,a:a})},
    buzz:function(c,q,a){return F.setDoc(F.doc(db,'live',c,'answers',uid+'_'+q),{uid:uid,q:q,a:a,t:F.serverTimestamp()})}
  };
}

(async function start(){
  if(!code){askCode();return}
  render();
  try{backend=window.__playMock||await firebaseBackend()}
  catch(e){view.innerHTML=card('⚠️','Could not connect',esc(e.message||e));return}
  backend.subscribe(code,onState);
})();
</script>
</body>
</html>
