<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Sai Family — Scoreboard</title>
<link rel="stylesheet" href="theme.css">
<style>
html,body{background:radial-gradient(ellipse 90% 60% at 50% -10%,var(--navy-600) 0%,transparent 65%),var(--navy);color:#fff}
.wrap{max-width:1500px;margin:0 auto;padding:2vh 2.5vw 8vh;min-height:100vh;display:flex;flex-direction:column}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:1.4vw;align-items:stretch;margin-bottom:1.4vh}
.team{position:relative;border:1px solid rgba(255,255,255,.18);border-radius:10px;background:rgba(255,255,255,.07);padding:1.4vh 1.8vw;display:flex;justify-content:space-between;align-items:center;gap:12px;overflow:hidden}
.team::before{content:"";position:absolute;inset:0 auto 0 0;width:.55vw;background:var(--blue-site)}
.score .team:last-child::before{background:var(--orange)}
.team.ctl{border-color:var(--orange);box-shadow:0 0 0 2px rgba(230,126,23,.6),0 0 40px rgba(230,126,23,.22)}
.team .n{font:700 clamp(18px,2.4vw,36px)/1.1 var(--font-head)}
.team .l{font-size:clamp(10px,1vw,14px);letter-spacing:.14em;color:#b9ccd5;font-weight:700;text-transform:uppercase}
.team .s{font:700 clamp(40px,5.6vw,92px)/1 var(--font-head);color:var(--orange-on-dark);font-variant-numeric:tabular-nums}
.ctag{display:inline-block;font-size:clamp(9px,.9vw,13px);background:var(--orange);color:var(--navy);border-radius:999px;padding:2px 10px;margin-left:8px;font-weight:800;vertical-align:middle;letter-spacing:.06em}
.mid{display:grid;place-items:center;text-align:center;padding:0 1vw}
.mid b{font:700 clamp(15px,1.7vw,26px) var(--font-head);color:var(--orange-on-dark);letter-spacing:.04em}
.mid span{display:block;font-size:clamp(9px,.9vw,12px);color:#b9ccd5;letter-spacing:.08em;text-transform:uppercase}
.timer{font:700 clamp(30px,3.8vw,60px) var(--font-head);color:var(--orange-on-dark);font-variant-numeric:tabular-nums}
.timer.u{color:#ff8a80}
.cat{font-size:clamp(11px,1.2vw,18px);letter-spacing:.16em;font-weight:700;color:var(--orange-on-dark);text-align:center;text-transform:uppercase}
.q{font:700 clamp(26px,3.5vw,54px)/1.1 var(--font-head);color:#fff;text-align:center;margin:.6vh auto 1.6vh;max-width:1250px}
.grid{display:grid;gap:1vh;flex:1;align-content:start}
.a{display:flex;align-items:center;gap:1.4vw;padding:1vh 1.4vw;border-radius:10px;border:1px solid var(--navy-600);background:rgba(255,255,255,.05);min-height:7vh}
.a .rk{display:grid;place-items:center;width:clamp(36px,4vw,64px);height:clamp(36px,4vw,64px);border-radius:6px;background:var(--orange);color:var(--navy);font:700 clamp(20px,2.6vw,42px)/1 var(--font-head)}
.a .t{flex:1;font-size:clamp(20px,2.7vw,44px);font-weight:700}
.a .p{font:700 clamp(24px,3.4vw,56px)/1 var(--font-head);color:var(--orange-on-dark);min-width:3ch;text-align:right}
.a.off .t{color:#5f8ea3;letter-spacing:.3em}
.a.off .p{color:#4d7a8f}
.a.on{background:linear-gradient(90deg,var(--blue-site),#34a3ad);border-color:transparent;animation:flip .6s ease}
.a.on .p{color:#fff}
@keyframes flip{0%{transform:perspective(700px) rotateX(80deg);filter:brightness(2)}60%{transform:perspective(700px) rotateX(-10deg)}100%{transform:none;filter:none}}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:1.4vh;gap:2vw}
.strikes{display:flex;gap:.8vw}
.strikes i{font-style:normal;display:grid;place-items:center;width:clamp(36px,4.8vw,76px);height:clamp(36px,4.8vw,76px);border-radius:6px;border:1px solid var(--navy-600);background:rgba(255,255,255,.04);color:#4d7a8f;font-size:clamp(20px,3vw,48px);font-weight:700}
.strikes i.on{background:#b4322c;border-color:#ff8a80;color:#fff}
.pts{font-size:clamp(14px,2vw,30px);color:#c4d4db}
.pts b{font-family:var(--font-head);color:var(--orange-on-dark);font-size:1.5em}
.banner{margin:0 0 1.4vh;padding:1.2vh;text-align:center;border-radius:10px;background:rgba(180,50,44,.55);border:2px solid #ff8a80;color:#fff;font-weight:800;font-size:clamp(16px,2.2vw,32px);animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(255,138,128,.2)}}
.ok{text-align:center;color:var(--teal-on-dark);font-weight:700;font-size:clamp(16px,2vw,30px);margin-top:1vh}
.sf{margin-top:1.4vh}
.sfr{display:grid;grid-template-columns:3vw 1fr 23vw 23vw;gap:1vw;align-items:center;padding:1.1vh .8vw;border-top:1px solid rgba(255,255,255,.14)}
.sfr:first-child{border-top:0}.sfr.cur{background:rgba(230,126,23,.14);border-radius:1vh}.sfr.dim{opacity:.4}
.sfr .no{font:700 clamp(22px,2.6vw,42px) var(--font-head);color:var(--orange-on-dark)}
.sfr .sq{font-size:clamp(16px,2vw,32px);font-weight:700;line-height:1.2}
.sfc{display:flex;flex-direction:column;position:relative;padding:.8vh 1vw;border-radius:1vh;background:rgba(255,255,255,.08);min-height:7vh;justify-content:center}
.sfc small{font:700 clamp(10px,.9vw,15px) var(--font);letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.sfc b{font-size:clamp(16px,1.9vw,30px)}.sfc i{position:absolute;right:.8vw;top:50%;transform:translateY(-50%);font:800 clamp(22px,2.6vw,42px)/1 var(--font-head);font-style:normal}
.sfc.ok{background:#1f6b36}.sfc.bad{background:#7d2118}.sfc.hid b{opacity:.5}
.sftot{display:flex;justify-content:center;gap:6vw;margin-top:2vh;font-size:clamp(20px,2.4vw,40px);font-weight:700}.sftot b{color:var(--orange-on-dark);margin-left:.5vw}
.fq{display:flex;gap:1.4vw;padding:1.6vh 1vw;border-top:1px solid rgba(255,255,255,.14);align-items:baseline}
.fq:first-child{border-top:0}
.fq .no{font:700 clamp(22px,2.8vw,44px) var(--font-head);color:var(--orange-on-dark)}
.fq .t{font-size:clamp(18px,2.6vw,40px);font-weight:700}
.fq .ans{font-size:clamp(14px,1.8vw,26px);color:#cfdde4;margin-top:4px}
.win{margin:2vh auto;text-align:center;padding:3vh 3vw;border-radius:var(--r-lg);background:rgba(230,126,23,.12);border:2px solid rgba(245,160,77,.6);max-width:900px}
.win h2{font:700 clamp(32px,5.4vw,84px)/1.05 var(--font-head);color:var(--orange-on-dark);margin:6px 0}
.win div{font-size:clamp(14px,1.8vw,26px)}
.wait{margin:auto;text-align:center}
.wait h1{font-size:clamp(30px,4.4vw,64px);color:#fff}
.wait p{color:#b9ccd5;font-size:clamp(14px,1.6vw,22px)}
.fx{position:fixed;inset:0;display:flex;gap:2.4vw;align-items:center;justify-content:center;background:rgba(40,0,10,.5);z-index:9;pointer-events:none;animation:fade 1.1s forwards}
.fx span{font-size:min(30vh,22vw);font-weight:800;color:#ff6b62;border:.035em solid #ff6b62;border-radius:.12em;padding:0 .12em;background:rgba(80,0,16,.55)}
@keyframes fade{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.06)}78%{opacity:1}100%{opacity:0}}
input{font:inherit;font-size:20px;padding:12px;border-radius:var(--r);border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;text-align:center;text-transform:uppercase;width:220px}
button{font:inherit;font-weight:700;border:0;border-radius:var(--r);background:var(--orange);color:var(--navy);padding:12px 22px;font-size:16px;margin-left:8px;cursor:pointer}
@media(prefers-reduced-motion:reduce){.a.on,.banner,.fx{animation:none}.fx{display:none}}

/* ----- continuous projector: lobby, question, breaks ----- */
.center{margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2.4vh}
.big{font:700 clamp(40px,6.4vw,110px)/1.04 var(--font-head);color:#fff;margin:0}
.sub{font-size:clamp(18px,2.4vw,40px);color:var(--orange-on-dark);margin:0;font-weight:600}
.lobby{flex:1;display:grid;grid-template-columns:minmax(260px,34vw) 1fr;gap:5vw;align-items:center}
.qr{background:#fff;padding:1.6vw;border-radius:var(--r-lg);box-shadow:var(--shadow-lg)}
.qr svg,.qr-corner svg{display:block;width:100%;height:auto}
.lobby-text .big{margin:1vh 0}
.how{font-size:clamp(16px,2vw,32px);line-height:1.5;color:#e3ecf0;margin:3vh 0 2vh}
.how b{color:var(--orange-on-dark)}
.how .code{font:700 1.5em var(--font-head);letter-spacing:.14em}
.joined{display:inline-block;margin-top:1vh;font-size:clamp(16px,1.9vw,30px);color:#d8e6ec;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:.6vh 1.6vw}
.joined b{font-family:var(--font-head);color:var(--teal-on-dark);font-size:1.4em;margin-right:.4em}
.bigq{font-size:clamp(32px,5.2vw,86px)!important;margin:3vh auto!important}
.qrow{display:flex;justify-content:center;align-items:center;gap:7vw;margin-top:3vh}
.qcount{display:flex;align-items:center;gap:1.4vw}
.qcount b{font:700 clamp(60px,9vw,150px)/1 var(--font-head);color:var(--teal-on-dark);font-variant-numeric:tabular-nums}
.qcount span{font-size:clamp(14px,1.8vw,28px);color:#d0dde4;line-height:1.25}
.qtime{font:700 clamp(60px,9vw,150px)/1 var(--font-head);color:var(--orange-on-dark);font-variant-numeric:tabular-nums;min-width:2ch;text-align:center}
.qtime.u{color:#ff8a80}
.qr-corner{position:fixed;right:2vw;bottom:3vh;width:min(11vw,150px);background:#fff;padding:.5vw;border-radius:var(--r);box-shadow:var(--shadow-lg)}
.dots::after{content:"";animation:dots 1.4s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.hint{position:fixed;left:1.2vw;bottom:1.2vh;font-size:12px;color:#8fb1c0;opacity:0;animation:hint 9s ease 1s}
@keyframes hint{0%{opacity:0}10%,80%{opacity:.9}100%{opacity:0}}
.conn{position:fixed;top:1.2vh;right:1.2vw;background:rgba(180,50,44,.85);color:#fff;font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px;z-index:20}
body.idle{cursor:none}
@media(max-width:800px){.lobby{grid-template-columns:1fr}}

/* ----- sound prompt ----- */
.snd{position:fixed;left:50%;bottom:12vh;transform:translateX(-50%);z-index:30;font:700 clamp(16px,1.8vw,28px) var(--font);padding:1.4vh 2.4vw;border:0;border-radius:999px;background:var(--orange);color:var(--navy);box-shadow:var(--shadow-lg);cursor:pointer;animation:sndpulse 1.8s ease-in-out infinite}
@keyframes sndpulse{50%{box-shadow:0 0 0 14px rgba(230,126,23,.25)}}
.snd.on{left:1.2vw;top:1.2vh;bottom:auto;transform:none;font-size:12px;font-weight:600;padding:5px 12px;background:rgba(255,255,255,.12);color:#cfe0e8;box-shadow:none;animation:none;cursor:default;opacity:.7}
/* face-off: buzzers open / who buzzed first */
#fo{position:fixed;inset:0;z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 40%,#12445c 0%,#0a2230 75%);color:#fff}
#fo.on{display:flex}
#fo .k{font:800 3.2vh/1 var(--font,inherit);letter-spacing:.3em;color:var(--orange,#e67e17);margin-bottom:3vh}
#fo .h{font:800 15vh/1 var(--font-head,var(--font,inherit));text-transform:uppercase;letter-spacing:.02em}
#fo.open .h{font-size:11vh;animation:fopulse .8s ease-in-out infinite alternate}
#fo.ready .h{opacity:.9}
#fo .vs{display:flex;gap:6vw;align-items:center;margin-top:5vh}
#fo .fq2{font:700 5.4vh/1.25 var(--font-head,var(--font,inherit));max-width:80vw;margin-top:4vh}
#fo .tm{min-width:30vw;padding:3vh 2vw;border-radius:2vh;border:.5vh solid rgba(255,255,255,.35);background:rgba(255,255,255,.07)}
#fo .tm small{display:block;font:700 2.6vh/1 var(--font,inherit);letter-spacing:.2em;opacity:.8}
#fo .tm b{display:block;font:800 6vh/1.15 var(--font-head,var(--font,inherit));margin-top:1.2vh}
#fo .tm.A{border-color:#59b7e6}#fo .tm.B{border-color:#f5a447}
#fo .tm.win{background:var(--orange,#e67e17);color:#0d2d3d;border-color:#fff;transform:scale(1.12)}
#fo .big{font:800 11vh/1.1 var(--font-head,var(--font,inherit));margin-top:2vh}
#fo .sub{font:600 4vh/1.2 var(--font,inherit);margin-top:2vh;opacity:.9}
@keyframes fopulse{from{transform:scale(1)}to{transform:scale(1.05)}}
@media(prefers-reduced-motion:reduce){#fo.open .h{animation:none}}
</style>

<script>/* games.js - the game registry shared by the host console (index), the emcee view and the projector display.
   Every game is a plug-in with the SAME contract:
     id, label, icon, itemLabel, fields[], kinds[], defaults
     row(item)            -> {a, b, chip}   one line in the content library
     summary(items)       -> text for the session screen
     validate(items)      -> '' or an error message
     init(items, sv)      -> state S (JSON only; saved at surveys/{id}/data/game as {game,S})
     act(S, action, d)    -> mutates S (the tech console calls this)
     tech(S)              -> HTML for the IT tech console   (buttons use data-g="<id>" data-act="..."; inputs data-gi)
     host(S)              -> HTML for the emcee (read-only, may show hidden answers)
     publicState(S, sv)   -> JSON mirrored to display/{code}  (NEVER hidden answers)
     display(D)           -> HTML for the projector
   Add a new game by registering one more object with window.GAMES.register(...). Nothing else changes. */
(function(){
'use strict';
var G={};window.GAMES=G;
G.order=[];
G.adapters={};
G.register=function(g){G[g.id]=g;if(G.order.indexOf(g.id)<0)G.order.push(g.id);if(g.toCommon)G.adapters[g.id]={toCommon:g.toCommon,fromCommon:g.fromCommon}};
/* Transfer between shows: item -> common {text,answer,answers,hint,category,pts,tags,source} -> item of the other show */
G.convert=function(item,from,to){var a=G.adapters[from],b=G.adapters[to];if(!a||!b)return null;var c=a.toCommon(item),o=b.fromCommon(c);o.tags=(c.tags||[]).slice();return o};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
G.esc=esc;
var clone=function(o){return JSON.parse(JSON.stringify(o))};
var norm=function(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()};
var TEAMS=['Truth','Right Action','Peace','Love'];
function mkTeams(n,old){var a=[];for(var i=0;i<n;i++)a.push({name:(old&&old[i]&&old[i].name)||TEAMS[i]||('Team '+(i+1)),score:(old&&old[i]&&old[i].score)||0});return a}
function leader(teams){var m=Math.max.apply(null,teams.map(function(t){return t.score})),w=teams.filter(function(t){return t.score===m});return w.length===1?w[0]:null}

/* ---------- shared styles (injected once, used on every page) ---------- */
var css='.gm{font-family:inherit;color:#ffffff}'+
'.gm-score{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:0 0 12px}'+
'.gm-team{border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:8px 12px;background:#134257}'+
'.gm-team.on{border-color:#f08c2a;box-shadow:0 0 0 2px rgba(230,126,23,.5)}'+
'.gm-team b{display:block;font-size:12px;color:#b9ccd5}.gm-team b i{font-style:normal;background:#f08c2a;color:#0d2d3d;border-radius:9px;padding:0 6px;margin-left:6px;font-size:10px}'+
'.gm-team span{font-size:30px;font-weight:900;color:#f08c2a;font-variant-numeric:tabular-nums}'+
'.gm-big .gm-team{padding:1.4vh 1.4vw;border-radius:16px}.gm-big .gm-team b{font-size:clamp(14px,1.8vw,26px)}.gm-big .gm-team span{font-size:clamp(34px,5.4vw,84px)}'+
'.gm-cat{font-size:11px;letter-spacing:.14em;font-weight:900;color:#f08c2a;text-transform:uppercase}.gm-big .gm-cat{font-size:clamp(12px,1.4vw,20px)}'+
'.gm-q{font-size:22px;font-weight:800;line-height:1.25;margin:6px 0 10px}.gm-big .gm-q{font-size:clamp(26px,4.2vw,64px);text-align:center;margin:2vh auto;max-width:1200px;line-height:1.15}'+
'.gm-a{padding:10px 12px;border-radius:10px;background:#6b3a0a;border:1px solid #c47a1a;color:#ffe9d2;font-weight:800;margin:8px 0}.gm-big .gm-a{font-size:clamp(22px,3.4vw,52px);text-align:center;padding:2vh 2vw}'+
'.gm-note{font-size:12px;color:#b9ccd5;margin:4px 0}.gm-warn{padding:8px 12px;border-radius:10px;background:rgba(112,45,59,.55);border:1px solid #ff8a8a;color:#ffd6cf;font-weight:800;margin:8px 0}'+
'.gm-grid{display:grid;gap:6px;margin:8px 0}.gm-cell{padding:10px 4px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:#1b5570;color:#f08c2a;font-weight:900;font-size:18px;text-align:center;cursor:pointer;font-family:inherit}'+
'.gm-cell.used{background:#08202c;color:#5f8ea3;cursor:default;border-color:rgba(255,255,255,.08)}.gm-head{padding:10px 4px;background:#134257;border-radius:8px;text-align:center;font-weight:900;font-size:13px;color:#fff;border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}'+
'.gm-big .gm-cell{font-size:clamp(20px,3.6vw,56px);padding:2.4vh 0}.gm-big .gm-head{font-size:clamp(12px,1.7vw,26px);padding:1.6vh .4vw}'+
'.gm-timer{font-size:28px;font-weight:900;color:#f08c2a;font-variant-numeric:tabular-nums}.gm-timer.u{color:#ff8a80}.gm-big .gm-timer{font-size:clamp(34px,5vw,80px)}'+
'.gm-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}.gm-row label{font-size:12px;color:#b9ccd5;display:flex;gap:6px;align-items:center}'+
'.gm-row input,.gm-row select{font:inherit;font-size:13px;padding:7px 9px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:#0d2d3d;color:#fff;width:auto}'+
'.gm-b{font:inherit;font-weight:800;font-size:13px;padding:8px 12px;border-radius:9px;border:1px solid rgba(255,255,255,.25);background:#134257;color:#ffffff;cursor:pointer}.gm-b.gold{background:#f08c2a;color:#0d2d3d;border-color:#f08c2a}.gm-b.red{background:#702d3b;border-color:#ff8a80}.gm-b.grn{background:#6b3a0a;border-color:#c47a1a}'+
'.gm-sound{font-size:clamp(46px,12vw,200px);font-weight:900;color:#f08c2a;text-align:center;line-height:1;letter-spacing:.04em;margin:1vh 0;text-transform:uppercase}.gm-chain{display:flex;flex-direction:column;gap:6px;margin-top:8px}'+
'.gm-link{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:#134257}.gm-link.bad{opacity:.65;border-color:#ff8a80}.gm-link small{color:#b9ccd5}.gm-big .gm-link{font-size:clamp(14px,2vw,30px);padding:1vh 1vw}'+
'.gm-win{margin:3vh auto;text-align:center;padding:3vh 3vw;border-radius:20px;background:rgba(230,126,23,.1);border:2px solid rgba(230,126,23,.5);max-width:900px}.gm-win h2{font-size:clamp(28px,5vw,76px);color:#f08c2a;margin:6px 0}'+
'.gm-sug{display:flex;gap:6px;flex-wrap:wrap}.gm-sug span{background:#1b5570;border-radius:14px;padding:3px 10px;font-size:12px}'+
'.gm-sec{border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px 12px;margin:10px 0;background:rgba(8,32,44,.5)}';
if(typeof document!=='undefined'){var st=document.createElement('style');st.textContent=css;(document.head||document.documentElement).appendChild(st);

    {k:'tags',label:'Sets / tags (comma separated)',t:'tags',full:1}],
  defaults:{kind:'bhajan'},
  toCommon:function(q){return{text:'',answer:q.en,answers:[],hint:q.hint||'',category:q.category||'',pts:0,tags:q.tags||[],source:''}},
  fromCommon:function(c){return{game:'antakshari',kind:'bhajan',en:(c.answer||c.text||'').trim(),hint:c.hint||'',category:c.category||''}},
  row:function(q){return{a:q.en,b:q.hint||q.category||'',chip:'Bhajan'}},
  summary:function(items){return items.length+' bhajans in the helper list (teams may sing any bhajan)'},
  validate:function(){return ''},
  init:function(items){
    return{game:'antakshari',teams:mkTeams(4),turn:0,sound:'',chain:[],used:[],pts:2,view:'play',warn:'',timerSecs:0,timerEndsAt:0,
      bank:items.map(function(q){return{t:q.en,h:q.hint||''}})}},
  act:function(S,a,d){
    if(a!=='noop')S.warn='';
    if(timerAct(S,a,d))return S;
    switch(a){
      case 'nteams':setTeams(S,d.v);S.turn=Math.min(S.turn,S.teams.length-1);break;
      case 'tname':S.teams[+d.i].name=String(d.v||'').trim()||('Team '+(+d.i+1));break;
      case 'adj':S.teams[+d.i].score+=+d.v;break;
      case 'turn':S.turn=+(d.v!==undefined?d.v:d.i)||0;break;
      case 'sound':S.sound=norm(d.v);break;
      case 'pts':S.pts=Math.max(1,+d.v||1);break;
      case 'valid':{var t=String(d.title||'').trim();if(!t){S.warn='Type the bhajan that was sung first.';break}
        var n=norm(t);
        if(d.force!=='1'){
          if(S.used.indexOf(n)>=0){S.warn='"'+t+'" was already sung. Press "Accept anyway" if you still want to count it.';S.pending=t;break}
          if(S.sound&&n.indexOf(S.sound)!==0){S.warn='"'+t+'" does not start with "'+S.sound+'". Press "Accept anyway" to override.';S.pending=t;break}}
        S.pending='';S.teams[S.turn].score+=S.pts;S.used.push(n);S.chain.push({t:S.turn,title:t,ok:true});S.sound=lastSound(t);S.turn=(S.turn+1)%S.teams.length;
        if(S.timerSecs)S.timerEndsAt=Date.now()+S.timerSecs*1000;break}
      case 'miss':S.chain.push({t:S.turn,title:'(no bhajan in time)',ok:false});S.sound='';S.turn=(S.turn+1)%S.teams.length;S.timerEndsAt=0;break;
      case 'newchain':S.sound='';S.timerEndsAt=0;break;
      case 'undo':{var l=S.chain.pop();if(l){S.turn=l.t;if(l.ok){S.teams[l.t].score-=S.pts;S.used.pop();var p=S.chain.filter(function(x){return x.ok}).pop();S.sound=p?lastSound(p.title):''}}break}
      case 'done':S.view='done';S.timerEndsAt=0;break;
      case 'resume':S.view='play';break;
    }
    return S},
  tech:function(S){
    var g='antakshari',n=S.sound,sug=S.bank.filter(function(b){return n&&norm(b.t).indexOf(n)===0&&S.used.indexOf(norm(b.t))<0}).slice(0,10);
    var h='<div class="gm">'+teamBoard(S.teams,S.turn)+teamTools(g,S)+adjust(g,S);
    h+='<div class="gm-sec"><div class="gm-cat">Next bhajan must start with</div><div class="gm-sound">'+(S.sound?esc(S.sound):'any')+'</div>'+
      '<div class="gm-row"><label>Change sound <input data-gi="'+g+'" data-act="sound" value="'+esc(S.sound)+'" size="8" placeholder="e.g. re"></label>'+btn(g,'newchain','Free start (new chain)')+'<label>Pts per link <input type="number" min="1" data-gi="'+g+'" data-act="pts" value="'+S.pts+'" style="width:60px"></label></div>'+timerBtns(g,S)+

      (S.warn?'<div class="gm-warn">'+esc(S.warn)+'</div>':'')+

        '<button class="gm-b grn" data-g="'+g+'" data-act="valid" data-from="gm_song">✓ Valid (+'+S.pts+')</button>'+
        (S.pending?'<button class="gm-b gold" data-g="'+g+'" data-act="valid" data-from="gm_song" data-force="1">Accept anyway</button>':'')+
        btn(g,'miss','✗ Missed / time up','','red')+btn(g,'undo','↶ Undo last')+'</div>'+
      (sug.length?'<div class="gm-note">Ideas starting with "'+esc(S.sound)+'":</div><div class="gm-sug">'+sug.map(function(b){return '<span>'+esc(b.t)+'</span>'}).join('')+'</div>':'')+'</div>'+
      '<div class="gm-sec"><div class="gm-cat">Chain ('+S.chain.filter(function(c){return c.ok}).length+' bhajans sung)</div><div class="gm-chain">'+
        S.chain.slice(-8).reverse().map(function(c){return '<div class="gm-link'+(c.ok?'':' bad')+'"><b>'+esc(S.teams[c.t]?S.teams[c.t].name:'')+'</b> '+esc(c.title)+'</div>'}).join('')+'</div>'+
        '<div class="gm-row">'+btn(g,'done','Finish game &amp; show winner','','grn')+(S.view==='done'?btn(g,'resume','Resume'):'')+'</div></div></div>';
    return h},
  host:function(S){
    var n=S.sound,sug=S.bank.filter(function(b){return n&&norm(b.t).indexOf(n)===0&&S.used.indexOf(norm(b.t))<0}).slice(0,12);
    if(S.view==='done'){var w=leader(S.teams);return '<div class="gm">'+teamBoard(S.teams,-1)+'<div class="gm-win"><div>FINAL</div><h2>'+(w?esc(w.name)+' wins!':'It is a tie!')+'</h2></div></div>'}
    return '<div class="gm">'+teamBoard(S.teams,S.turn)+'<div class="gm-sec"><div class="gm-cat">'+esc(S.teams[S.turn].name)+' to sing · next bhajan starts with</div><div class="gm-sound">'+(S.sound?esc(S.sound):'any')+'</div>'+timerHtml(S)+
      (sug.length?'<div class="gm-note">Prompts if a team is stuck:</div><div class="gm-sug">'+sug.map(function(b){return '<span>'+esc(b.t)+'</span>'}).join('')+'</div>':'')+'</div>'+
      '<div class="gm-sec"><div class="gm-cat">Chain</div><div class="gm-chain">'+S.chain.slice(-6).reverse().map(function(c){return '<div class="gm-link'+(c.ok?'':' bad')+'"><b>'+esc(S.teams[c.t].name)+'</b> '+esc(c.title)+'</div>'}).join('')+'</div></div></div>'},
  publicState:function(S,sv){
    return{game:'antakshari',title:sv&&sv.name||'',view:S.view,teams:S.teams.map(function(t){return{name:t.name,score:t.score}}),turn:S.turn,sound:S.sound,
      chain:S.chain.slice(-6).map(function(c){return{team:S.teams[c.t]?S.teams[c.t].name:'',title:c.title,ok:c.ok}}),count:S.chain.filter(function(c){return c.ok}).length,
      timerSecs:S.timerSecs||0,timerEndsAt:S.timerEndsAt||0,updatedAt:Date.now()}},
  display:function(D){
    var h='<div class="gm gm-big">'+teamBoard(D.teams,D.view==='done'?-1:D.turn,true);
    if(D.view==='done'){var w=leader(D.teams);return h+'<div class="gm-win"><div>FINAL RESULT</div><h2>'+(w?esc(w.name)+' wins!':'It is a tie!')+'</h2><div>'+D.count+' bhajans sung</div></div></div>'}
    h+='<div class="gm-cat" style="text-align:center">'+esc(D.teams[D.turn].name)+' — next bhajan starts with</div><div class="gm-sound">'+(D.sound?esc(D.sound):'any')+'</div><div style="text-align:center">'+timerHtml(D)+'</div>'+
      '<div class="gm-chain">'+D.chain.slice().reverse().map(function(c){return '<div class="gm-link'+(c.ok?'':' bad')+'"><b>'+esc(c.team)+'</b> '+esc(c.title)+'</div>'}).join('')+'</div>';
    return h+'</div>'}
});
})();

      '<div class="sftot"><div>'+esc(t.A.name)+' <b>'+F.totals.A+'</b></div><div>'+esc(t.B.name)+' <b>'+F.totals.B+'</b></div></div>';
    if(D.fast.awarded){var w=t.A.score===t.B.score?null:(t.A.score>t.B.score?t.A:t.B);
      h+='<div class="win"><div>FINAL RESULT</div><h2>'+(w?esc(w.name)+' wins!':'It’s a tie — One Sai Family wins!')+'</h2><div>'+esc(t.A.name)+' '+t.A.score+' — '+t.B.score+' '+esc(t.B.name)+'</div></div>'}

  app.innerHTML=h;
  clearInterval(timerT);if(D.timerRunning)timerT=setInterval(function(){var e=document.getElementById('tm'),l=timeLeft();if(e){e.textContent=String(l).padStart(2,'0')+'s';e.className='timer'+(l<=5?' u':'')}if(l>5)gTick=-1;else if(l>0&&l!==gTick){gTick=l;snd('tick')}},500)}
/* ---------- every stage of the show on one continuous screen ---------- */
function joinUrl(){var u=new URL('play.html',location.href);u.search='?code='+code;u.hash='';return u.toString()}
function shortUrl(){return joinUrl().replace(/^https?:\/\//,'').replace(/\?.*$/,'')}
function qrHtml(cls){var s=window.qrSvgTag?window.qrSvgTag(joinUrl()):'';return s?'<div class="'+cls+'">'+s+'</div>':''}
function qLeft(){return L&&L.closesAt?Math.max(0,Math.ceil((L.closesAt-(Date.now()+offset))/1000)):0}
function answersNow(){if(!ST||!L)return null;return ST.q===L.q?ST.count:0}
function pick(){
  if(L&&L.show==='blank')return 'blank';
  if(L&&L.show==='intermission')return 'break';
  if(D)return 'game';
  if(L){var p=L.phase;
    if(p==='idle')return 'lobby';if(p==='open')return 'question';if(p==='closed')return 'closed';
    if(p==='done'||p==='ended')return L.stage==='gate'?'gate':(L.stage==='tabulating'?'tabulating':'thanks')}
  return 'wait'}
function centered(h){return '<div class="center">'+h+'</div>'}
function drawStage(n){
  var logo='<div><span class="sssio-logo xl"></span></div>',h='',a=answersNow();
  if(n==='blank'){app.innerHTML='';return}
  if(n==='break')h=centered(logo+'<h1 class="big">We will be right back</h1><p class="sub">Please stay seated. Sai Ram.</p>');
  else if(n==='wait')h=centered(logo+'<h1 class="big">One Sai Family</h1><p class="sub">Survey Says! The program will begin shortly…</p>');
  else if(n==='lobby')h='<div class="lobby">'+qrHtml('qr')+'<div class="lobby-text"><div class="cat" style="text-align:left">THE AUDIENCE ROUND</div><h1 class="big">Scan to play</h1><p class="sub">Join the survey on your phone</p>'+
    '<p class="how">or go to <b>'+esc(shortUrl())+'</b><br>and enter the code <b class="code">'+esc(code)+'</b></p>'+(ST&&ST.devices>0?'<div class="joined"><b id="dev">'+ST.devices+'</b> phones connected</div>':'')+'</div></div>';
  else if(n==='question')h='<div class="cat">QUESTION '+(L.q+1)+(L.total?' OF '+L.total:'')+'</div><div class="q bigq">'+esc((L.question&&L.question.en)||'')+'</div>'+
    '<div class="qrow">'+(a!=null?'<div class="qcount"><b id="qc">'+a+'</b><span>answers<br>so far</span></div>':'')+'<div class="qtime" id="qt">'+qLeft()+'</div></div>'+qrHtml('qr-corner');
  else if(n==='closed')h=centered('<h1 class="big">Time is up</h1><p class="sub">Thank you! '+(a!=null?'<b>'+a+'</b> answers received.':'')+'</p>'+qrHtml('qr-corner'));
  else if(n==='tabulating')h=centered(logo+'<h1 class="big">Counting the votes<span class="dots"></span></h1><p class="sub">Thank you, audience!</p>');
  else if(n==='gate')h=centered(logo+'<h1 class="big">Thank you, audience!</h1><p class="sub">Contestants, please come up. The game is about to begin.</p>');
  else if(n==='thanks')h=centered(logo+'<h1 class="big">Thank you!</h1><p class="sub">The game begins shortly.</p>');
  app.innerHTML=h;
  if(n==='question')qT=setInterval(function(){var e=document.getElementById('qt');if(e){var l=qLeft();e.textContent=l;e.className='qtime'+(l<=10?' u':'');if(l>5)tickAt=-1;else if(l>0&&l!==tickAt){tickAt=l;snd('tick')}}},300)}
var foSoundKey=null;
/* The face-off sounds follow what is ON SCREEN: whenever the overlay shows a new state, its sound plays once (never on the first
   document after the page opens, so a reload does not replay an old buzz). */
function foSound(f){
  var key=f?f.id+'|'+f.state:'';
  if(foSoundKey===null){foSoundKey=key;return}
  if(key===foSoundKey)return;foSoundKey=key;
  if(f&&f.state==='won')snd('buzzin');else if(f&&f.state==='open')snd('faceoff')}
function drawFo(){var el=document.getElementById('fo');if(!el||!L)return;var f=L.fo;foSound(f);
  if(!f||(f.state!=='ready'&&f.state!=='open'&&f.state!=='won')){el.className='';el.innerHTML='';return}
  var nm=f.names||{A:'Team A',B:'Team B'},w=f.state==='won'?f.winner:null;
  var tm=function(k){return '<div class="tm '+k+(w===k?' win':'')+'"><small>TEAM '+k+'</small><b>'+esc(nm[k])+'</b></div>'};
  var key=f.id+f.state+(f.winner||'');if(el.getAttribute('data-k')===key)return;el.setAttribute('data-k',key);
  el.className='on '+(w?'won':f.state);
  el.innerHTML=f.state==='ready'?'<div class="k">FACE-OFF</div><div class="h">Get ready…</div><div class="vs">'+tm('A')+tm('B')+'</div><div class="sub">The question comes next</div>':w?'<div class="k">FACE-OFF</div><div class="h" style="font-size:9vh">'+esc(nm[w])+'</div><div class="big">buzzed first!</div><div class="vs">'+tm('A')+tm('B')+'</div>'
    :'<div class="k">FACE-OFF</div><div class="h">Buzzers open!</div>'+(f.q?'<div class="fq2">'+esc(f.q)+'</div>':'')+'<div class="vs">'+tm('A')+tm('B')+'</div>'}
function draw(){var n=pick();clearInterval(timerT);clearInterval(qT);drawFo();
  if(n==='game'&&['lobby','question','closed','tabulating','gate','thanks'].indexOf(lastScreen)>=0)snd('intro');
  lastScreen=n;if(n==='game'){drawGame();return}drawStage(n)}
function onLive(d){soundForLive(L,d);L=d;if(d&&d.hostNow)offset=d.hostNow-Date.now();draw()}
function onStats(s){ST=s;var c=document.getElementById('qc'),v=document.getElementById('dev');
  if(c&&s&&L&&s.q===L.q)c.textContent=s.count;if(v&&s)v.textContent=s.devices;
  if(!c&&!v&&s&&(pick()==='lobby'||pick()==='question'||pick()==='closed'))draw()}
/* ---------- sound: the hall speakers are on THIS laptop, so every sound is played here ---------- */
function snd(n){try{if(!PREVIEW&&window.Sound)Sound.play(n)}catch(e){}}
function nOn(r){return r.answers.filter(function(a){return a.on}).length}
function soundForDoc(p,d){
  if(!d)return;
  /* the other games (Jeopardy, Antakshari, …): points up = ding (fanfare for a big gain), points down = buzzer */
  if(d.game&&p&&p.game===d.game&&Array.isArray(d.teams)&&Array.isArray(p.teams)&&d.teams.length===p.teams.length){
    var gain=0,loss=false;d.teams.forEach(function(t,i){var df=(+t.score||0)-(+p.teams[i].score||0);if(df>0)gain=Math.max(gain,df);if(df<0)loss=true});
    if(loss&&!gain)snd('buzzer');else if(gain>=500){snd('fanfare');setTimeout(function(){snd('applause')},250)}else if(gain>0)snd('ding')}
  var pr=p&&p.round,nr=d.round;
  if(nr&&pr&&pr.n===nr.n){
    if(nOn(nr)>nOn(pr))snd('ding');
    if(nr.strikes>pr.strikes)snd('buzzer');
    if(nr.awarded&&!pr.awarded){snd('fanfare');setTimeout(function(){snd('applause')},250)}
    if(nr.steal&&!pr.steal)snd('steal')
  }else if(nr&&pr)snd('sting');
  if(p&&d.view==='fast'&&p.view!=='fast')snd('saifive');
  if(p&&p.fast&&d.fast){
    if(d.fast.shown>p.fast.shown){var rw=(d.fast.rows[d.fast.shown-1])||{},sc=(rw.A&&rw.A.ok)||(rw.B&&rw.B.ok),bad=(rw.A&&!rw.A.ok)||(rw.B&&!rw.B.ok);   // a reveal: ding for points, buzzer for "not on the board"
      if(sc)snd('ding');if(bad)setTimeout(function(){snd('buzzer')},sc?450:0)}
    if(d.fast.awarded&&!p.fast.awarded){snd('fanfare');setTimeout(function(){snd('applause')},250)}}
  if(p&&p.timerRunning&&!d.timerRunning&&d.timerSeconds===0)snd('timeup')}
function soundForLive(p,d){
  if(!d)return;

  if(p&&d.mode!=='buzzer'){
    if(d.phase==='open'&&(p.phase!=='open'||p.q!==d.q))snd('sting');
    if(p.phase==='open'&&d.phase==='closed'&&p.q===d.q)snd('timeup')}
  if(p&&d.mode==='buzzer'){   // phone buzzers in the other games: ready sound, then the buzz-in sound
    if(d.phase==='open'&&(p.phase!=='open'||p.q!==d.q))snd('faceoff');
    if(d.phase==='locked'&&p.phase!=='locked')snd('buzzin')}
  if(d.snd&&window.Sound){Sound.setMuted(!!d.snd.mute);if(typeof d.snd.vol==='number')Sound.setVolume(d.snd.vol);Sound.setPack(d.snd.pack||'builtin')}
  // a cue from the tech's soundboard (cues already in the document when this page opens are not replayed)
  if(!cueSeen){cueSeen=true;lastCue=d.cue&&d.cue.id}
  else if(d.cue&&d.cue.id!==lastCue){lastCue=d.cue.id;if(d.cue.name==='stop'){if(window.Sound)Sound.stop()}else snd(d.cue.name)}}
/* keep the screen on, full screen on F / double-click, hide the mouse, show a quiet dot if the connection drops */
function kiosk(){
  var wl=function(){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(function(){})}catch(e){}};wl();
  document.addEventListener('visibilitychange',function(){if(!document.hidden)wl()});
  var fs=function(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()}catch(e){}};
  document.addEventListener('keydown',function(e){if(e.key==='f'||e.key==='F')fs()});document.addEventListener('dblclick',fs);
  var sb=document.getElementById('snd');
  function showSnd(){var s=window.Sound?Sound.state():null;if(!s||!sb)return;
    if(!s.unlocked){sb.className='snd';sb.textContent='🔊 Click here once to turn the sound on';return}
    sb.className='snd on';sb.textContent=s.mute?'🔇 Sound is muted from the tech laptop':'🔊 Sound on'+(s.pack!=='builtin'?' · '+s.pack+' set ('+s.packFiles.length+' files)':'')+(s.files.length?' · your files: '+s.files.join(', '):'')}
  /* Sound is ON by default. Browsers keep a page silent until it is allowed to play, so: try straight away (works when the
     site is allowed to play sound, or Chrome was started with --autoplay-policy=no-user-gesture-required), keep retrying,
     and any click or key press on this page switches it on for good. */
  var wasOn=false;
  function soundState(s){if(s.unlocked&&!wasOn){wasOn=true;Sound.loadFiles('sounds/');snd('ding')}showSnd()}
  function unlockSound(){if(window.Sound&&!Sound.state().unlocked)Sound.unlock()}
  if(window.Sound){Sound.onState(soundState);['pointerdown','keydown','touchstart'].forEach(function(ev){document.addEventListener(ev,unlockSound)});unlockSound();setInterval(unlockSound,2000)}
  var hint=document.createElement('div');hint.className='hint';hint.textContent='Press F for full screen';document.body.appendChild(hint);
  var mt=null,idle=function(){document.body.classList.add('idle')};mt=setTimeout(idle,3000);
  document.addEventListener('mousemove',function(){document.body.classList.remove('idle');clearTimeout(mt);mt=setTimeout(idle,3000)});
  if(window.SrvClient&&window.BACKEND==='server')window.SrvClient.onStatus(function(s){var e=document.getElementById('conn');if(e)e.classList.toggle('hidden',s==='online')})}
function onDoc(d){
  var key=d&&d.round?'r'+d.round.n:(d&&d.view);
  if(d&&d.round&&key===prevKey&&d.round.strikes>prevStrikes){fxEl.innerHTML='<div class="fx">'+new Array(Math.max(1,d.round.strikes)+1).join('<span>✕</span>')+'</div>';setTimeout(function(){fxEl.innerHTML=''},1150)}
  prevKey=key;prevStrikes=d&&d.round?d.round.strikes:0;soundForDoc(D,d);D=d;draw()}

async function firebaseBackend(){
  var cfg=window.FIREBASE_CONFIG;if(!cfg||!cfg.apiKey||/PASTE|YOUR/i.test(cfg.apiKey))throw new Error('This site is not configured yet (firebase-config.js).');
  var A=await import(FB+'firebase-app.js'),F=await import(FB+'firebase-firestore.js'),Au=await import(FB+'firebase-auth.js');
  /* Named app = separate saved login. The default app's login belongs to the tech's Google session; signing in anonymously on it would sign the tech out of every tab. */
  var a=A.initializeApp(cfg,'audience'),db=F.getFirestore(a),auth=Au.getAuth(a);await Au.signInAnonymously(auth);
  return{subscribe:function(c,cb){return F.onSnapshot(F.doc(db,'display',c),function(s){cb(s.exists()?s.data():null)},function(){cb(null)})},
    subscribeLive:function(c,cb){return F.onSnapshot(F.doc(db,'live',c),function(s){cb(s.exists()?s.data():null)},function(){})}}}
(async function(){
  if(!code){askCode();return}
  draw();
  var b;try{b=window.__displayMock||(window.BACKEND==='server'?{subscribe:function(c,cb){return window.SrvClient.subscribe('display:'+c,cb,{screen:true})},subscribeLive:function(c,cb){return window.SrvClient.subscribe('live:'+c,cb,{screen:true})},subscribeStats:function(c,cb){return window.SrvClient.subscribe('stats:'+c,cb,{screen:true})}}:await firebaseBackend())}catch(e){app.innerHTML='<div class="wait"><h1>Could not connect</h1><p>'+esc(e.message)+'</p></div>';return}
  if(PREVIEW){var sb0=document.getElementById('snd');if(sb0)sb0.style.display='none'}
  else{kiosk();if(window.SrvClient&&window.BACKEND==='server')window.SrvClient.hello(code,'projector')}
  if(b.subscribeLive)b.subscribeLive(code,onLive);
  if(b.subscribeStats)b.subscribeStats(code,onStats);
  b.subscribe(code,onDoc)})();
