<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Sai Family — Scoreboard</title>
<style>
:root{--gold:#f4cb73;--white:#f7faff;--muted:#abc1d9;--teal:#64e1d0;--coral:#ff827e;--border:rgba(203,225,247,.2)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse 80% 55% at 50% -10%,#24507d 0%,transparent 70%),linear-gradient(135deg,#061224,#0a1d38 55%,#061224);color:var(--white);font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1400px;margin:0 auto;padding:2.2vh 2.5vw;min-height:100vh;display:flex;flex-direction:column}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:1.4vw;align-items:stretch;margin-bottom:2vh}
.team{border:2px solid var(--border);border-radius:18px;background:linear-gradient(135deg,#15385b,#0d2743);padding:1.4vh 1.6vw;display:flex;justify-content:space-between;align-items:center;gap:12px}
.team.ctl{border-color:var(--gold);box-shadow:0 0 0 2px rgba(244,203,115,.6),0 0 40px rgba(244,203,115,.2)}
.team .n{font-size:clamp(14px,2.2vw,32px);font-weight:900}.team .l{font-size:clamp(10px,1vw,14px);letter-spacing:.14em;color:var(--muted);font-weight:800}
.team .s{font-size:clamp(34px,6vw,96px);font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1}
.ctag{display:inline-block;font-size:clamp(9px,.9vw,13px);background:var(--gold);color:#152a3f;border-radius:20px;padding:2px 10px;margin-left:8px;font-weight:900;vertical-align:middle}
.mid{display:grid;place-items:center;text-align:center;padding:0 1vw}.mid b{font-size:clamp(12px,1.4vw,20px);letter-spacing:.06em}.mid span{display:block;font-size:clamp(9px,.9vw,12px);color:var(--muted)}
.timer{font-size:clamp(26px,3.6vw,56px);font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}.timer.u{color:var(--coral)}
.cat{font-size:clamp(11px,1.2vw,18px);letter-spacing:.18em;font-weight:900;color:var(--gold);text-align:center}
.q{font-size:clamp(24px,4vw,60px);font-weight:900;line-height:1.12;text-align:center;margin:1vh auto 2vh;max-width:1200px}
.grid{display:grid;gap:1.2vh;flex:1;align-content:start}
.a{display:flex;align-items:center;gap:1.4vw;padding:1.3vh 1.4vw;border-radius:14px;border:2px solid var(--border);background:#0d2745;min-height:7.5vh}
.a .rk{width:clamp(34px,4vw,64px);height:clamp(34px,4vw,64px);border-radius:12px;background:#16406a;display:grid;place-items:center;font-size:clamp(18px,2.4vw,38px);font-weight:900}
.a .t{flex:1;font-size:clamp(18px,3vw,46px);font-weight:900;letter-spacing:.02em}.a .p{font-size:clamp(20px,3.2vw,50px);font-weight:900;color:var(--gold);min-width:3ch;text-align:right}
.a.off .t{color:#31506f;letter-spacing:.3em}.a.off .p{color:#31506f}
.a.on{background:linear-gradient(90deg,#0f4a46,#0d3b4f);border-color:#1b9c96;animation:flip .6s ease}
@keyframes flip{0%{transform:perspective(700px) rotateX(80deg);filter:brightness(2)}60%{transform:perspective(700px) rotateX(-10deg)}100%{transform:none;filter:none}}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:2vh;gap:2vw}
.strikes{display:flex;gap:.8vw}.strikes i{font-style:normal;width:clamp(34px,4.6vw,72px);height:clamp(34px,4.6vw,72px);display:grid;place-items:center;border-radius:12px;border:2px solid var(--border);color:#3a556f;font-size:clamp(20px,3vw,48px);font-weight:900}
.strikes i.on{background:#702d3b;border-color:#ff7b86;color:#ffb3a9}
.pts{font-size:clamp(14px,2vw,30px);color:var(--muted)}.pts b{color:var(--gold);font-size:1.3em}
.banner{margin:0 0 1.4vh;padding:1.2vh;text-align:center;border-radius:12px;background:rgba(112,45,59,.6);border:2px solid #ff8a8a;color:#ffd6cf;font-weight:900;font-size:clamp(16px,2.2vw,32px);animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(255,130,126,.18)}}
.ok{text-align:center;color:var(--teal);font-weight:900;font-size:clamp(16px,2vw,30px);margin-top:1vh}
.fq{display:flex;gap:1.4vw;padding:1.6vh 1vw;border-top:1px solid var(--border);align-items:baseline}.fq:first-child{border-top:0}.fq .no{color:var(--gold);font-weight:900;font-size:clamp(20px,2.6vw,40px)}
.fq .t{font-size:clamp(18px,2.6vw,40px);font-weight:800}.fq .ans{font-size:clamp(14px,1.8vw,26px);color:#cfe0ef;margin-top:4px}
.win{margin:2vh auto;text-align:center;padding:3vh 3vw;border-radius:20px;background:rgba(244,203,115,.1);border:2px solid rgba(244,203,115,.5);max-width:900px}
.win h2{font-size:clamp(28px,5vw,76px);color:var(--gold);margin:6px 0}.win div{font-size:clamp(14px,1.8vw,26px)}
.wait{margin:auto;text-align:center}.wait h1{font-size:clamp(28px,4vw,60px)}.wait p{color:var(--muted);font-size:clamp(14px,1.6vw,22px)}
.fx{position:fixed;inset:0;display:flex;gap:2.4vw;align-items:center;justify-content:center;background:rgba(45,0,12,.45);z-index:9;pointer-events:none;animation:fade 1.1s forwards}
.fx span{font-size:min(30vh,22vw);font-weight:900;color:#ff5560;border:.035em solid #ff5560;border-radius:.12em;padding:0 .12em;background:rgba(80,0,16,.55)}
@keyframes fade{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.06)}78%{opacity:1}100%{opacity:0}}
input{font:inherit;font-size:20px;padding:12px;border-radius:10px;border:2px solid #3b5f86;background:#0b2341;color:#fff;text-align:center;text-transform:uppercase;width:220px}
button{font:inherit;font-weight:800;border:0;border-radius:10px;background:var(--gold);color:#152a3f;padding:12px 20px;font-size:16px;margin-left:8px;cursor:pointer}
@media(prefers-reduced-motion:reduce){.a.on,.banner,.fx{animation:none}.fx{display:none}}
</style>
<script src="firebase-config.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="fx"></div>
<script>
'use strict';
var FB='https://www.gstatic.com/firebasejs/10.12.2/';
var app=document.getElementById('app'),fxEl=document.getElementById('fx');
var code=(new URLSearchParams(location.search).get('code')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
var D=null,prevStrikes=0,prevKey='',timerT=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function askCode(){app.innerHTML='<div class="wait"><h1>Scoreboard</h1><p>Enter the game code</p><input id="c" maxlength="5" autocomplete="off"><button id="g">Open</button></div>';
  document.getElementById('g').onclick=function(){var c=document.getElementById('c').value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(c)location.search='?code='+c}}
function timeLeft(){if(!D||!D.timerRunning||!D.timerEndsAt)return D?D.timerSeconds:0;return Math.max(0,Math.ceil((D.timerEndsAt-Date.now())/1000))}
function draw(){
  if(!D){app.innerHTML='<div class="wait"><h1>One Sai Family</h1><p>Survey Says! The game will begin shortly…</p></div>';return}
  var t=D.teams,ctl=D.round?D.round.control:null,tl=timeLeft(),showT=D.timerRunning||(D.timerSeconds&&D.timerSeconds<60&&D.timerEndsAt);
  var h='<div class="score"><div class="team'+(ctl==='A'?' ctl':'')+'"><div><div class="l">TEAM A'+(ctl==='A'?'<span class="ctag">PLAYING</span>':'')+'</div><div class="n">'+esc(t.A.name)+'</div></div><div class="s">'+t.A.score+'</div></div>'+
    '<div class="mid"><div><b>ONE SAI FAMILY</b><span>SURVEY SAYS!</span>'+(D.timerRunning?'<div class="timer'+(tl<=5?' u':'')+'" id="tm">'+String(tl).padStart(2,'0')+'s</div>':'')+'</div></div>'+
    '<div class="team'+(ctl==='B'?' ctl':'')+'"><div><div class="l">TEAM B'+(ctl==='B'?'<span class="ctag">PLAYING</span>':'')+'</div><div class="n">'+esc(t.B.name)+'</div></div><div class="s">'+t.B.score+'</div></div></div>';
  if(D.view==='fast'&&D.fast){
    h+='<div class="cat">⚡ FAST MONEY · '+D.fast.questions.length+' QUESTIONS</div><div style="margin-top:2vh">'+
      D.fast.questions.map(function(f,i){return '<div class="fq"><span class="no">'+(i+1)+'</span><div><div class="t">'+esc(f.q)+'</div>'+(f.answers?'<div class="ans">'+f.answers.map(function(a){return esc(a.t)+' ('+a.p+')'}).join(' · ')+'</div>':'')+'</div></div>'}).join('')+'</div>';
    if(D.fast.awarded){var w=t.A.score===t.B.score?null:(t.A.score>t.B.score?t.A:t.B);
      h+='<div class="win"><div>FINAL RESULT</div><h2>'+(w?esc(w.name)+' wins!':'It’s a tie — One Sai Family wins!')+'</h2><div>'+esc(t.A.name)+' '+t.A.score+' — '+t.B.score+' '+esc(t.B.name)+'</div></div>'}
  }else if(D.round){
    var r=D.round;
    h+='<div class="cat">ROUND '+r.n+' OF '+r.of+' · '+esc(r.category.toUpperCase())+(r.mult>1?' · '+r.mult+'× POINTS':'')+'</div><div class="q">'+esc(r.question)+'</div>'+
      (r.steal?'<div class="banner">STEAL — '+esc(t[r.stealTeam].name)+' gets one guess</div>':'')+
      '<div class="grid">'+r.answers.map(function(a,i){return a.on?'<div class="a on"><span class="rk">'+(i+1)+'</span><span class="t">'+esc(a.t)+'</span><span class="p">'+a.p+'</span></div>':'<div class="a off"><span class="rk">'+(i+1)+'</span><span class="t">••••••••</span><span class="p">?</span></div>'}).join('')+'</div>'+
      '<div class="foot"><div class="strikes">'+[0,1,2].map(function(i){return '<i class="'+(i<r.strikes?'on':'')+'">✕</i>'}).join('')+'</div>'+
      '<div class="pts">Revealed points'+(r.mult>1?' (×'+r.mult+')':'')+' <b>'+r.answers.reduce(function(s,a){return s+(a.on?a.p:0)},0)*r.mult+'</b></div></div>'+
      (r.awarded?'<div class="ok">Round awarded to '+esc(t[r.awarded.team].name)+' (+'+r.awarded.points+')</div>':'');
  }
  app.innerHTML=h;
  clearInterval(timerT);if(D.timerRunning)timerT=setInterval(function(){var e=document.getElementById('tm'),l=timeLeft();if(e){e.textContent=String(l).padStart(2,'0')+'s';e.className='timer'+(l<=5?' u':'')}},500)}
function onDoc(d){
  var key=d&&d.round?'r'+d.round.n:(d&&d.view);
  if(d&&d.round&&key===prevKey&&d.round.strikes>prevStrikes){fxEl.innerHTML='<div class="fx">'+new Array(Math.max(1,d.round.strikes)+1).join('<span>✕</span>')+'</div>';setTimeout(function(){fxEl.innerHTML=''},1150)}
  prevKey=key;prevStrikes=d&&d.round?d.round.strikes:0;D=d;draw()}

async function firebaseBackend(){
  var cfg=window.FIREBASE_CONFIG;if(!cfg||!cfg.apiKey||/PASTE|YOUR/i.test(cfg.apiKey))throw new Error('This site is not configured yet (firebase-config.js).');
  var A=await import(FB+'firebase-app.js'),F=await import(FB+'firebase-firestore.js'),Au=await import(FB+'firebase-auth.js');
  var a=A.initializeApp(cfg),db=F.getFirestore(a),auth=Au.getAuth(a);await Au.signInAnonymously(auth);
  return{subscribe:function(c,cb){return F.onSnapshot(F.doc(db,'display',c),function(s){cb(s.exists()?s.data():null)},function(){cb(null)})}}}
(async function(){
  if(!code){askCode();return}
  draw();
  var b;try{b=window.__displayMock||await firebaseBackend()}catch(e){app.innerHTML='<div class="wait"><h1>Could not connect</h1><p>'+esc(e.message)+'</p></div>';return}
  b.subscribe(code,onDoc)})();
</script>
</body>
</html>
